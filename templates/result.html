<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Paper Summary</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#0f172a;
            color:white;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:auto;
            padding:40px 20px;
        }

        h1{
            text-align:center;
            color:#38bdf8;
            margin-bottom:30px;
        }

        .card{
            background:#1e293b;
            padding:25px;
            border-radius:15px;
            margin-bottom:25px;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        }

        h2{
            color:#38bdf8;
            margin-bottom:15px;
        }

        p{
            line-height:1.8;
            color:#e2e8f0;
        }

        textarea{
            width:100%;
            height:120px;
            border:none;
            border-radius:10px;
            padding:15px;
            font-size:16px;
            margin-top:10px;
            background:#334155;
            color:white;
        }

        button{
            margin-top:15px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0ea5e9;
        }

        .answer-box{
            margin-top:20px;
            background:#334155;
            padding:20px;
            border-radius:10px;
        }

        .back-btn{
            text-decoration:none;
            color:white;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>AI Research Paper Summarizer</h1>

    <div class="card">
        <h2>Summary</h2>

        <p>
            {{ summary }}
        </p>
    </div>

    <div class="card">

        <h2>Ask Questions</h2>

        <form method="POST" action="/ask">

            <textarea
                name="question"
                placeholder="Ask anything about the research paper..."
                required></textarea>

            <button type="submit">
                Ask Question
            </button>

        </form>

    </div>

    {% if answer %}

    <div class="card">

        <h2>Answer</h2>

        <div class="answer-box">
            {{ answer }}
        </div>

    </div>

    {% endif %}

    <button>
        <a href="/" class="back-btn">Upload Another PDF</a>
    </button>

</div>

</body>
</html>
